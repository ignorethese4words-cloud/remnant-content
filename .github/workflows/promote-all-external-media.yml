name: Promote All External Media

on:
  push:
    paths:
      - scripts/promote-all-external-media.mjs
      - .github/workflows/promote-all-external-media.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout content repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Promote every approved external live image that is downloadable
        run: node scripts/promote-all-external-media.mjs

      - name: Validate promoted files and pack URLs
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('media/external-promotion-report.json','utf8'));
          const bad = [];
          for (const item of report.promoted || []) {
            const rel = item.to.split('/main/')[1];
            if (!rel || !fs.existsSync(rel) || fs.statSync(rel).size <= 0) bad.push(`${item.siteId}/${item.imageId}: missing controlled file`);
            const packFile = `packs/${item.county.toLowerCase().replace(/ county$/,'').replace(/[^a-z0-9]+/g,'-')}-county.json`;
            const pack = JSON.parse(fs.readFileSync(packFile,'utf8'));
            const site = (pack.exploreSites || []).find(s => s.id === item.siteId);
            const image = (site?.displayImages || []).find(i => i?.id === item.imageId);
            const uri = image?.remoteUri || image?.source?.uri || '';
            if (uri !== item.to) bad.push(`${item.siteId}/${item.imageId}: pack not rewritten to controlled media`);
          }
          if (bad.length) { console.error(bad.join('\n')); process.exit(1); }
          console.log(`Validated ${report.promoted?.length || 0} promoted image(s); ${report.skipped?.length || 0} source(s) remain flagged.`);
          NODE

      - name: Commit successful promotions and report
        run: |
          if git diff --quiet; then
            echo "No external-media changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media packs pack-index.json
          git commit -m "Promote external media to controlled delivery"
          git push
