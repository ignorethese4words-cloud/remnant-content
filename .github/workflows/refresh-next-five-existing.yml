name: Refresh next verified existing sites

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-next-five-existing.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh Alamakee and Alaska Tunnel from verified worker payloads
        run: |
          python - <<'PY'
          import json, datetime
          pack_path='packs/canonical/colorado-boulder.json'
          idx_path='pack-index.json'
          pack=json.load(open(pack_path,encoding='utf-8'))
          sites=pack.get('sites',[])
          by_id={s.get('id'):i for i,s in enumerate(sites) if s.get('id')}
          replacements={
            'CO-BOULDER-ALAMAKEE':{
              'id':'CO-BOULDER-ALAMAKEE','name':'Alamakee','location':'Gold Hill Mining District','county':'Boulder County','category':'Historic Mine','componentType':'Mine','appReady':False,'betaVisible':False,'contentUpdatedAt':'2026-09-08T07:31:00.000Z',
              'overview':['Alamakee was one of the original mining discoveries at Gold Hill and is documented in federal mining history and historic Boulder-area archival records.'],
              'timeline':[{'year':'Early Gold Hill mining era','text':'Federal mining history identifies Alamakee among the original discoveries at Gold Hill.'},{'year':'1895','text':'A surviving Boulder Historical Society/Carnegie Library photograph identifies the Alamakee Mine in the Gold Hill landscape.'}],
              'moreHistory':['USGS mining history documents the Alamakee name at Gold Hill, while mapped locality evidence provides a stable mine-level identification anchor near 40.06611, -105.40472.','The known 1895 archival photograph is retained as research evidence, but its item-level reuse basis is not sufficiently clear for Remnant packaging. It is therefore not shipped in the app.'],
              'displayImages':[],'mediaNotice':'Historic image not available','mediaSearchStatus':'SEARCH_EXHAUSTED','coordinates':{'latitude':40.06611,'longitude':-105.40472}
            },
            'CO-BOULDER-ALASKA-TUNNEL':{
              'id':'CO-BOULDER-ALASKA-TUNNEL','name':'Alaska Tunnel','location':'Ward Mining District','county':'Boulder County','category':'Historic Mine Tunnel','componentType':'Adit / Portal','appReady':False,'betaVisible':False,'contentUpdatedAt':'2026-09-08T07:31:00.000Z',
              'overview':['Alaska Tunnel is a named historic tunnel locality in Boulder County\'s Ward Mining District, preserved in federal/MRDS-derived mineral locality records.'],
              'timeline':[{'year':'Historic mining era','text':'The Alaska Tunnel was developed within the Ward district\'s dense network of underground mine and tunnel workings.'},{'year':'Modern mapping','text':'Mineral-locality mapping preserves Alaska Tunnel near the Tarbox/Smoky Gold United workings cluster.'}],
              'moreHistory':['The mapped locality near 40.07333, -105.50667 provides a defensible historic tunnel-level Scan anchor without claiming that Remnant has field-surveyed a surviving portal opening.','A focused exact-site media search did not verify a publishable Alaska Tunnel photograph; nearby Ward-district imagery was rejected rather than assigned to the wrong tunnel.'],
              'displayImages':[],'mediaNotice':'Historic image not available','mediaSearchStatus':'SEARCH_EXHAUSTED','coordinates':{'latitude':40.07333,'longitude':-105.50667}
            }
          }
          for sid,site in replacements.items():
            if sid not in by_id: raise SystemExit(f'Missing existing public site {sid}')
            sites[by_id[sid]]=site
          now=datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z')
          pack['sites']=sites
          pack['generatedAt']=now
          pack['version']=str(int(pack.get('version','0'))+1)
          with open(pack_path,'w',encoding='utf-8') as f: json.dump(pack,f,indent=2); f.write('\n')
          idx=json.load(open(idx_path,encoding='utf-8'))
          target=next(p for p in idx['packs'] if p.get('id')=='colorado-boulder')
          target['version']=pack['version']
          idx['contentVersion']=now; idx['generatedAt']=now
          with open(idx_path,'w',encoding='utf-8') as f: json.dump(idx,f,indent=2); f.write('\n')
          assert target['exploreSiteCount']==3 and target['idOnlySiteCount']==33 and target['siteCount']==36
          print('Refreshed Alamakee and Alaska Tunnel without changing counts')
          PY
      - name: Commit delivery refresh
        run: |
          git config user.name 'Remnant Content Promoter'
          git config user.email 'actions@users.noreply.github.com'
          git add packs/canonical/colorado-boulder.json pack-index.json
          git commit -m 'Refresh Alamakee and Alaska Tunnel verified payloads'
          git push
