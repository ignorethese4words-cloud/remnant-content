name: Bootstrap Remnant Content

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-content.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout content repo
        uses: actions/checkout@v4

      - name: Pull live index and all county packs
        run: |
          python - <<'PY'
          import json, os, re, urllib.request

          INDEX_URL = 'https://drive.usercontent.google.com/download?id=1hH7crzHI2s-bJtRrMAdnNZXva-Pye5CM&export=download&confirm=t'
          RAW_BASE = 'https://raw.githubusercontent.com/ignorethese4words-cloud/remnant-content/main/packs/'

          def filename_for(county):
              slug = county.lower().replace(' county', '')
              slug = re.sub(r'[^a-z0-9]+', '-', slug).strip('-')
              return f'{slug}-county.json'

          def aliases(site):
              values = []
              site_id = site.get('id')
              if site_id:
                  values.append(str(site_id))
              for legacy in site.get('legacyIds') or []:
                  if legacy:
                      values.append(str(legacy))
              return values

          def public_images(site):
              images = site.get('displayImages')
              if not isinstance(images, list):
                  return []
              return [img for img in images if isinstance(img, dict) and img.get('privateTestOnly') is not True]

          def preserve_published_media(previous, incoming):
              if not previous:
                  return incoming, 0

              old_by_alias = {}
              for old_site in previous.get('exploreSites') or []:
                  images = public_images(old_site)
                  if not images:
                      continue
                  for alias in aliases(old_site):
                      old_by_alias.setdefault(alias, images)

              restored = 0
              for site in incoming.get('exploreSites') or []:
                  if public_images(site):
                      continue
                  match = None
                  for alias in aliases(site):
                      if alias in old_by_alias:
                          match = old_by_alias[alias]
                          break
                  if match:
                      site['displayImages'] = match
                      site.pop('mediaNotice', None)
                      restored += 1
              return incoming, restored

          os.makedirs('packs', exist_ok=True)
          with urllib.request.urlopen(INDEX_URL, timeout=60) as r:
              index = json.load(r)

          packs = index.get('packs', [])
          if len(packs) < 19:
              raise RuntimeError(f'Expected at least 19 live county packs, found {len(packs)}')

          hosted = []
          expected_files = set()
          for entry in packs:
              county = entry.get('county')
              source = entry.get('payloadUrl')
              if not county or not source:
                  raise RuntimeError(f'Invalid index entry: {entry}')
              filename = filename_for(county)
              expected_files.add(filename)
              destination = os.path.join('packs', filename)

              previous = None
              if os.path.exists(destination):
                  try:
                      previous = json.load(open(destination, encoding='utf-8'))
                  except Exception:
                      previous = None

              print(f'Downloading {county} from live payload')
              with urllib.request.urlopen(source, timeout=60) as r:
                  incoming = json.load(r)

              incoming, restored = preserve_published_media(previous, incoming)
              with open(destination, 'w', encoding='utf-8') as f:
                  json.dump(incoming, f, indent=2)
                  f.write('\n')
              if restored:
                  print(f'{county}: restored approved media for {restored} Explore site(s) from prior public payload')

              entry['payloadUrl'] = RAW_BASE + filename
              hosted.append(county)

          for existing in os.listdir('packs'):
              if existing.endswith('.json') and existing not in expected_files:
                  os.remove(os.path.join('packs', existing))

          index['delivery'] = 'github'
          index['githubHostedCounties'] = hosted
          with open('pack-index.json', 'w', encoding='utf-8') as f:
              json.dump(index, f, indent=2)
              f.write('\n')

          with open('README.md', 'w', encoding='utf-8') as f:
              f.write('# Remnant Content\n\nPublic phone-delivery payloads only. The Remnant application source, registry, research workflow, and internal data remain private.\n')
          PY

      - name: Validate all payloads against live index counts
        run: |
          python - <<'PY'
          import json, os, re, subprocess

          def filename_for(county):
              slug = county.lower().replace(' county', '')
              slug = re.sub(r'[^a-z0-9]+', '-', slug).strip('-')
              return f'{slug}-county.json'

          def aliases(site):
              values = []
              if site.get('id'):
                  values.append(str(site['id']))
              for legacy in site.get('legacyIds') or []:
                  if legacy:
                      values.append(str(legacy))
              return values

          def public_images(site):
              images = site.get('displayImages')
              if not isinstance(images, list):
                  return []
              return [img for img in images if isinstance(img, dict) and img.get('privateTestOnly') is not True]

          def previous_payload(path):
              try:
                  raw = subprocess.check_output(['git', 'show', f'HEAD:{path}'], text=True)
                  return json.loads(raw)
              except Exception:
                  return None

          idx = json.load(open('pack-index.json', encoding='utf-8'))
          packs = idx.get('packs', [])
          assert len(packs) >= 19
          assert len(idx.get('githubHostedCounties', [])) == len(packs)

          for entry in packs:
              county = entry['county']
              filename = filename_for(county)
              path = os.path.join('packs', filename)
              assert os.path.exists(path), f'Missing payload for {county}'
              payload = json.load(open(path, encoding='utf-8'))
              assert payload.get('county') == county, f'County mismatch for {county}'
              explore = payload.get('exploreSites')
              identify = payload.get('identificationSites')
              assert isinstance(explore, list), f'Missing exploreSites for {county}'
              assert isinstance(identify, list), f'Missing identificationSites for {county}'

              explore_ids = {str(site.get('id')) for site in explore if site.get('id')}
              id_only = [site for site in identify if site.get('id') and str(site.get('id')) not in explore_ids]

              expected_explore = entry.get('exploreSiteCount')
              expected_id = entry.get('idOnlySiteCount')
              if expected_explore is not None:
                  assert len(explore) == int(expected_explore), f'Explore count mismatch for {county}: {len(explore)} != {expected_explore}'
              if expected_id is not None:
                  assert len(id_only) == int(expected_id), f'ID-only count mismatch for {county}: {len(id_only)} != {expected_id}'
              assert entry['payloadUrl'].endswith('/packs/' + filename), f'GitHub URL mismatch for {county}'

              previous = previous_payload(path)
              if previous:
                  prior_media = {}
                  for old_site in previous.get('exploreSites') or []:
                      images = public_images(old_site)
                      if not images:
                          continue
                      for alias in aliases(old_site):
                          prior_media[alias] = len(images)

                  for site in explore:
                      matched_prior = None
                      for alias in aliases(site):
                          if alias in prior_media:
                              matched_prior = prior_media[alias]
                              break
                      if matched_prior and not public_images(site):
                          raise AssertionError(
                              f'Media regression for {county} / {site.get("name")}: prior public gallery had {matched_prior} image(s), new payload has none'
                          )

              print(county, 'Explore', len(explore), 'ID-only', len(id_only), 'media-preservation OK')
          PY

      - name: Commit public delivery files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md pack-index.json packs
          git commit -m 'Publish all live Remnant county packs to GitHub' || exit 0
          git push
