name: V4 Media Ingest to Supabase Storage

on:
  push:
    branches: [main]
    paths:
      - 'v4/media-requests/*.json'
  workflow_dispatch:
    inputs:
      request_path:
        description: 'Exact v4/media-requests/*.json file to retry'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: remnant-v4-media-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      INGEST_URL: https://gbgehvkacuoyavgoucou.supabase.co/functions/v1/v4-media-store
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use pinned Python for optional PDF figure preparation
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Select changed ready requests only
        id: select
        env:
          REQUEST_PATH: ${{ inputs.request_path }}
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/media-requests.txt
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            requested="$REQUEST_PATH"
            if [[ ! "$requested" =~ ^v4/media-requests/[a-zA-Z0-9._-]+\.json$ ]] || [[ ! -f "$requested" ]]; then
              echo 'Unsafe or missing media request path' >&2
              exit 1
            fi
            printf '%s\n' "$requested" >> /tmp/media-requests.txt
          else
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- v4/media-requests/ |
              grep -E '^v4/media-requests/[A-Za-z0-9._-]+\.json$' > /tmp/media-requests.txt || true
          fi
          echo "Selected request files:"
          cat /tmp/media-requests.txt

      - name: Store approved media and verify durable receipt
        shell: bash
        run: |
          set -euo pipefail
          # Preserve a failed download/extraction as a durable SOURCE_BLOCKED lead
          # without creating or approving any media. A signed OIDC callback does
          # the write; GitHub itself remains the source of execution logs.
          report_failure() {
            local code="$1" line="$2"
            trap - ERR
            if [[ -n "${request:-}" && -f "$request" ]]; then
              local site_id media_id token_reply token report_path
              site_id=$(jq -r '.siteId // empty' "$request" 2>/dev/null || true)
              media_id=$(jq -r '.mediaId // empty' "$request" 2>/dev/null || true)
              if [[ "$site_id" =~ ^CO-[A-Z0-9-]+$ && "$media_id" =~ ^[A-Za-z0-9-]+$ ]]; then
                report_path=$(mktemp)
                jq -n --arg siteId "$site_id" --arg mediaId "$media_id" \
                  --arg requestPath "$request" \
                  --arg error "Native GitHub ingest failed (exit $code, shell line $line). Check exact workflow job logs for source/download/validation error." \
                  '{action:"report_failure",siteId:$siteId,mediaId:$mediaId,requestPath:$requestPath,error:$error}' > "$report_path"
                token_reply=$(curl --fail --silent --show-error \
                  -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                  "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=remnant-v4-media" || true)
                token=$(printf '%s' "$token_reply" | jq -r '.value // empty' 2>/dev/null || true)
                if [[ -n "$token" ]]; then
                  curl --fail --silent --show-error --max-time 30 -X POST "$INGEST_URL" \
                    -H "Authorization: Bearer $token" \
                    -H 'Content-Type: application/json' --data-binary @"$report_path" \
                    || echo "WARNING: Could not record media failure callback; inspect GitHub logs." >&2
                fi
                rm -f "$report_path"
              fi
            fi
            exit "$code"
          }
          trap 'report_failure "$?" "$LINENO"' ERR
          count=0
          while IFS= read -r request; do
            [[ -n "$request" ]] || continue
            if ! jq -e '.status == "READY"' "$request" >/dev/null; then
              echo "Skipping non-ready/legacy request: $request"
              continue
            fi
            submission_file="$request"
            if jq -e '(.sourcePdfUri // "") | (type == "string" and length > 0)' "$request" >/dev/null; then
              python3 -m pip install --disable-pip-version-check --quiet 'PyMuPDF==1.24.14'
              submission_file=$(mktemp)
              rm -f "$submission_file"
              python3 scripts/v4_pdf_figure_payload.py "$request" "$submission_file"
            fi
            oidc_response=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=remnant-v4-media")
            oidc_token=$(printf '%s' "$oidc_response" | jq -er '.value')
            response=$(mktemp)
            http_code=$(curl --silent --show-error --location --max-time 90 \
              -o "$response" -w '%{http_code}' \
              -X POST "$INGEST_URL" \
              -H "Authorization: Bearer $oidc_token" \
              -H 'Content-Type: application/json' \
              --data-binary @"$submission_file")
            if [[ "$http_code" != "200" ]] || ! jq -e '.ok == true and .receiptVerified == true' "$response" >/dev/null; then
              echo "Media ingest rejected $request (HTTP $http_code):" >&2
              cat "$response" >&2
              exit 1
            fi
            jq '{siteId,mediaId,bytes,storagePath,receiptVerified}' "$response"
            count=$((count+1))
            if [[ "$submission_file" != "$request" ]]; then rm -f "$submission_file"; fi
            rm -f "$response"
          done < /tmp/media-requests.txt
          echo "### V4 media ingest" >> "$GITHUB_STEP_SUMMARY"
          echo "- Permanently stored and verified: $count" >> "$GITHUB_STEP_SUMMARY"
