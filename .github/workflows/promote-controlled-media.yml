name: Promote Controlled Media

on:
  push:
    paths:
      - media/controlled-media-manifest.json
      - scripts/promote-controlled-media.mjs
      - .github/workflows/promote-controlled-media.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout content repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Promote approved media into Remnant-controlled storage
        run: node scripts/promote-controlled-media.mjs

      - name: Validate controlled media rule
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('media/controlled-media-manifest.json','utf8'));
          const bad = [];
          for (const item of manifest.items || []) {
            const p = item.controlledPath;
            if (!fs.existsSync(p) || fs.statSync(p).size <= 0) bad.push(`${item.siteId}: missing controlled file`);
            const packFile = `packs/${item.county.toLowerCase().replace(/ county$/,'').replace(/[^a-z0-9]+/g,'-')}-county.json`;
            const pack = JSON.parse(fs.readFileSync(packFile,'utf8'));
            const site = (pack.exploreSites || []).find(s => s.id === item.siteId);
            const urls = (site?.displayImages || []).map(i => i?.remoteUri || i?.source?.uri || '');
            if (!urls.some(u => u.includes('raw.githubusercontent.com/ignorethese4words-cloud/remnant-content/main/media/'))) bad.push(`${item.siteId}: pack does not use controlled media`);
          }
          if (bad.length) { console.error(bad.join('\n')); process.exit(1); }
          console.log('Controlled media validation passed.');
          NODE

      - name: Commit promoted media and pack updates
        run: |
          if git diff --quiet; then
            echo "No controlled-media changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media packs pack-index.json
          git commit -m "Promote approved media to controlled delivery"
          git push
