name: Promote verified ready sites

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-ready-top-five.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Promote four verified sites into public delivery packs
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone

          now = datetime.now(timezone.utc).isoformat().replace('+00:00','Z')

          targets = {
            'packs/canonical/colorado-bent.json': [
              {
                'id':'CO-BENT-FORT-LYON-HISTORIC-COMPLEX','name':'Fort Lyon Historic Military & Veterans Complex','location':'Fort Lyon','county':'Bent County','category':'Military Fort / Veterans Hospital Historic Complex','componentType':'Military Site','appReady':True,'betaVisible':True,'contentUpdatedAt':'2026-09-08T02:32:00.000Z',
                'overview':['Fort Lyon is a historic military and institutional campus in Bent County, established as a U.S. Army post in the nineteenth century and later adapted for medical and veterans-related uses.'],
                'timeline':['1867 — Fort Lyon was established at this location as a U.S. Army post.','1906 — The site entered a new institutional era after its military use.','1932 — Development continued during the site\'s veterans and medical period.'],
                'moreHistory':['National Park Service documentation identifies Fort Lyon as a historic district and confirms the site\'s long military and institutional history.'],
                'displayImages':[{'id':'fort-lyon-highsmith-38927','title':'Buildings at New Fort Lyon','label':'Documentary Photograph','source':{'uri':'https://cdn.loc.gov/service/pnp/highsm/38900/38927v.jpg'},'remoteUri':'https://cdn.loc.gov/service/pnp/highsm/38900/38927v.jpg','sourcePage':'https://www.loc.gov/item/2017688819/','sourceNote':'Carol M. Highsmith photograph, 2016. Library of Congress, Prints and Photographs Division, LC-DIG-highsm-38927.','rights':'Library of Congress rights advisory: No known restrictions on publication.','mediaStatus':'PACKAGED'}],
                'mediaSearchStatus':'FOUND_USABLE_MEDIA','coordinates':{'latitude':38.077222,'longitude':-103.132778}
              }
            ],
            'packs/canonical/colorado-boulder.json': [
              {
                'id':'CO-BOULDER-1905-MINE','name':'1905 Mine','location':'Hurricane Hill / Boulder County Tungsten Mining District','county':'Boulder County','category':'Historic Mine','componentType':'Mine','appReady':True,'betaVisible':True,'contentUpdatedAt':'2026-09-08T02:31:05.365Z',
                'overview':['The 1905 Mine was a small but documented tungsten producer beside Hurricane Hill Road in the Boulder County tungsten district.','USGS records place the mine 825 feet south 25 degrees west of the Vasco No. 1 shaft and describe shaft workings associated with a ferberite-bearing vein along the Hurricane Hill breccia reef.'],
                'timeline':[{'year':'Before 1916','text':'USGS indicates the mine may have produced tungsten before the surviving detailed production records begin.'},{'year':'1916-1918','text':'The mine was productive during the World War I tungsten boom. Incomplete USGS records document about 250 units of WO3 from ore averaging 12.9 percent WO3.'},{'year':'After 1918','text':'USGS reported no known later production and estimated that total historic output may have exceeded 1,000 units of WO3.'}],
                'moreHistory':['U.S. Geological Survey Professional Paper 245 describes the 1905 Mine at roughly 8,550 feet elevation beside Hurricane Hill Road. The documented position is relative to the Vasco No. 1 shaft, which provides a defensible historic mine-level Scan anchor while avoiding a claim that the exact shaft collar has been surveyed by Remnant.','The mine was developed by shaft workings that USGS believed were probably no more than about 150 feet deep. The vein lies in the hanging wall of the Hurricane Hill breccia reef, striking roughly northeast and dipping northwest through aplite and granite.','USGS attributes the property to Gold, Silver, & Tungsten, Inc. during the documented production period. The retained production figures are incomplete, so Remnant presents them as reported historical estimates rather than precise lifetime totals.'],
                'displayImages':[],'mediaNotice':'Historic image not available','mediaSearchStatus':'SEARCH_EXHAUSTED','coordinates':{'latitude':39.973771,'longitude':-105.484022}
              },
              {
                'id':'CO-BOULDER-ACME-MINE','name':'Acme Mine','location':'Louisville','county':'Boulder County','category':'Historic Coal Mine','componentType':'Mine','appReady':True,'betaVisible':True,'contentUpdatedAt':'2026-09-08T02:45:00.000Z',
                'overview':['The Acme Mine was a major Louisville-area coal mine that operated from the late nineteenth century into 1928 and helped shape the town\'s industrial landscape.','Historic state and local records document deep shaft workings, company housing, railroad service, and repeated subsidence effects beneath Louisville.'],
                'timeline':[{'year':'1890s','text':'The Acme Mine entered operation in Louisville during the expansion of Boulder County\'s northern coal field.'},{'year':'1903-1904','text':'Colorado\'s coal-mine inspector described the Acme as a two-shaft mine about 190 feet deep, connected to the Colorado & Southern Railroad.'},{'year':'1911','text':'Rocky Mountain Fuel Company acquired the Acme and operated it through its final years.'},{'year':'1922','text':'Industrial Commission records document 81 Acme employees in a wage case involving Rocky Mountain Fuel Company.'},{'year':'1928','text':'The Acme Mine closed after decades of coal production beneath and around Louisville.'}],
                'moreHistory':['Colorado mine-inspector records describe a main shaft and air shaft serving a roughly six-foot coal seam, with the main shaft divided for hoisting, pipe lines, and emergency access.','Local historical records preserve 1911 photographs of the Rocky Mountain Fuel Company\'s Acme Mine and company houses, confirming the mine\'s substantial surface plant and community setting.','Historic Louisville research also documents subsidence associated with Acme workings beneath the town, showing how the mine\'s underground footprint affected the later urban landscape.','For Remnant identification, the USGS/GNIS mine point at approximately 39.98193, -105.13665 is used as the documented mine-level anchor rather than claiming a surviving shaft collar has been field-surveyed.'],
                'displayImages':[],'mediaNotice':'Historic image not available','mediaSearchStatus':'SEARCH_EXHAUSTED','coordinates':{'latitude':39.9819296,'longitude':-105.136652}
              },
              {
                'id':'CO-BOULDER-AFTERTHOUGHT-MINE','name':'Afterthought Mine','location':'Jamestown Mining District','county':'Boulder County','category':'Historic Mine','componentType':'Mine','appReady':True,'betaVisible':True,'contentUpdatedAt':'2026-09-08T02:47:00.000Z',
                'overview':['The Afterthought Mine is a documented Jamestown Mining District fluorspar locality west of Jamestown with a stable mapped mine/tunnel anchor.','Federal mineral records preserve the site as a fluorite occurrence and modern USGS-derived mapping places the mine at approximately 40.12221, -105.40055.'],
                'timeline':[{'year':'Historic mining era','text':'The Afterthought workings were developed as part of the Jamestown district\'s fluorspar and metal-mining landscape.'},{'year':'Mid-20th century documentation','text':'Federal Jamestown-district mineral mapping retained the Afterthought Mine as a named fluorite locality.'},{'year':'Today','text':'USGS/GNIS-derived mapping preserves a stable mine-level point for identification, though Remnant does not claim that point is a field-surveyed portal collar.'}],
                'moreHistory':['USGS-linked mineral references identify the Afterthought Mine in Boulder County\'s Jamestown Mining District and record fluorite at the locality.','The mapped Afterthought Mine and Walker Tunnel share the same published mine-level coordinate, so Remnant treats the coordinate as a defensible locality anchor rather than asserting a specific surviving opening without field confirmation.','No defensible site-specific photograph with clear app-use rights was found in the media search; unrelated Jamestown mine photographs were rejected rather than attached to the wrong location.'],
                'displayImages':[],'mediaNotice':'Historic image not available','mediaSearchStatus':'SEARCH_EXHAUSTED','coordinates':{'latitude':40.1222078,'longitude':-105.40055}
              }
            ]
          }

          counts = {}
          for path, replacements in targets.items():
              data = json.load(open(path, encoding='utf-8'))
              by_id = {s.get('id'): i for i, s in enumerate(data.get('sites', [])) if s.get('id')}
              for site in replacements:
                  sid = site['id']
                  if sid in by_id:
                      data['sites'][by_id[sid]] = site
                  else:
                      data.setdefault('sites', []).append(site)
              data['generatedAt'] = now
              old_version = int(str(data.get('version','0'))) if str(data.get('version','0')).isdigit() else 0
              data['version'] = str(old_version + 1)
              with open(path,'w',encoding='utf-8') as f:
                  json.dump(data,f,indent=2,ensure_ascii=False); f.write('\n')
              explore = [s for s in data['sites'] if s.get('appReady') and s.get('betaVisible')]
              ids = [s for s in data['sites'] if isinstance(s.get('coordinates'),dict) and isinstance(s['coordinates'].get('latitude'),(int,float)) and isinstance(s['coordinates'].get('longitude'),(int,float))]
              explore_ids = {s['id'] for s in explore}
              id_only = [s for s in ids if s.get('id') not in explore_ids]
              counts[data['id']] = {'version':data['version'],'explore':len(explore),'id':len(id_only),'total':len(explore)+len(id_only)}

          idx = json.load(open('pack-index.json',encoding='utf-8'))
          for entry in idx.get('packs',[]):
              c = counts.get(entry.get('id'))
              if not c: continue
              entry['version'] = c['version']
              entry['exploreSiteCount'] = c['explore']
              entry['idOnlySiteCount'] = c['id']
              entry['siteCount'] = c['total']
          idx['generatedAt'] = now
          idx['contentVersion'] = now
          with open('pack-index.json','w',encoding='utf-8') as f:
              json.dump(idx,f,indent=2,ensure_ascii=False); f.write('\n')

          assert counts['colorado-bent']['explore'] == 1 and counts['colorado-bent']['id'] == 0 and counts['colorado-bent']['total'] == 1
          assert counts['colorado-boulder']['explore'] == 3 and counts['colorado-boulder']['id'] == 31 and counts['colorado-boulder']['total'] == 34
          print(counts)
          PY

      - name: Verify promoted IDs and manifest counts
        run: |
          python - <<'PY'
          import json
          expected = {
            'packs/canonical/colorado-bent.json': ['CO-BENT-FORT-LYON-HISTORIC-COMPLEX'],
            'packs/canonical/colorado-boulder.json': ['CO-BOULDER-1905-MINE','CO-BOULDER-ACME-MINE','CO-BOULDER-AFTERTHOUGHT-MINE']
          }
          for path, ids in expected.items():
              data=json.load(open(path,encoding='utf-8'))
              by={s['id']:s for s in data['sites']}
              assert len(by)==len(data['sites'])
              for sid in ids:
                  s=by[sid]
                  assert s.get('appReady') is True and s.get('betaVisible') is True
                  assert isinstance(s.get('coordinates'),dict)
                  if s.get('mediaSearchStatus')=='SEARCH_EXHAUSTED':
                      assert s.get('displayImages')==[] and s.get('mediaNotice')=='Historic image not available'
                  if s.get('mediaSearchStatus')=='FOUND_USABLE_MEDIA':
                      assert s.get('displayImages')
          idx=json.load(open('pack-index.json',encoding='utf-8'))
          by={p['id']:p for p in idx['packs']}
          assert (by['colorado-bent']['exploreSiteCount'],by['colorado-bent']['idOnlySiteCount'],by['colorado-bent']['siteCount'])==(1,0,1)
          assert (by['colorado-boulder']['exploreSiteCount'],by['colorado-boulder']['idOnlySiteCount'],by['colorado-boulder']['siteCount'])==(3,31,34)
          print('verification passed')
          PY

      - name: Commit promoted delivery content
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packs/canonical/colorado-bent.json packs/canonical/colorado-boulder.json pack-index.json
          git commit -m 'Promote verified ready sites to app delivery' || exit 0
          git push
